<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SpaceX Explorer</title>
    <script>
      var basePath = '/DigtAG-SpaceX-Explorer';
      var path = window.location.pathname.slice(basePath.length) || '/';
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.setItem('spa-redirect', path + search + hash);
      window.location.replace(basePath + '/');
    </script>
  </head>
  <body></body>
</html>
